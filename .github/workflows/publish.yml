name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify distributions
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify distribution contents
        shell: python
        run: |
          import pathlib
          import tarfile
          import zipfile

          bad_dirs = (
              "/.agents/",
              "/docs/",
              "/notebooks/",
              "/scripts/",
              "/sql/",
              "/src/",
          )
          bad_ext = (
              ".csv",
              ".tsv",
              ".jsonl",
              ".parquet",
              ".feather",
              ".pkl",
              ".pickle",
              ".db",
              ".sqlite",
              ".sqlite3",
              ".duckdb",
              ".ipynb",
              ".html",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
          )

          for artifact in pathlib.Path("dist").iterdir():
              if artifact.name.endswith(".tar.gz"):
                  names = tarfile.open(artifact).getnames()
              elif artifact.suffix == ".whl":
                  names = zipfile.ZipFile(artifact).namelist()
              else:
                  continue

              normalized = ["/" + name.replace("\\", "/") for name in names]
              offenders = [
                  name
                  for name, clean_name in zip(names, normalized)
                  if clean_name.endswith("/README.md")
                  or any(bad_dir in clean_name for bad_dir in bad_dirs)
                  or clean_name.lower().endswith(bad_ext)
              ]
              if offenders:
                  raise SystemExit(
                      f"{artifact.name} contains excluded files: {offenders}"
                  )

          print("Distribution contents OK")

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
