[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "td-ts-compressor"
version = "0.1.10"
description = "Python helpers for the ts_compress_to Teradata time-series table operator."
readme = "PACKAGE_README.md"
requires-python = ">=3.10"
authors = [
    { name = "Teradata time-series compressor contributors" }
]
dependencies = []

[project.optional-dependencies]
teradataml = ["teradataml"]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"td_ts_compressor.resources" = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
